<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Kiến trúc DataOps pipeline: dbt + Airflow + SQL Server + GitHub Actions</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6f42c1"/>
    </marker>
    <style>
      .panel { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
      .box { stroke: #8c959f; stroke-width: 1.2; }
      .title { font-size: 15px; font-weight: 700; fill: #1f2328; }
      .h { font-size: 13px; font-weight: 700; fill: #1f2328; }
      .t { font-size: 12px; fill: #31363c; }
      .s { font-size: 11px; fill: #57606a; }
      .flow { stroke: #57606a; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .notify { stroke: #6f42c1; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow-blue); }
      .read { stroke: #57606a; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
      .dashed { fill: #ffffff; stroke: #8c959f; stroke-dasharray: 4 3; }
    </style>
  </defs>

  <rect width="1200" height="790" fill="#ffffff"/>
  <text x="600" y="30" text-anchor="middle" class="title" font-size="18">DataOps pipeline — dbt + Apache Airflow + SQL Server + GitHub Actions</text>

  <!-- ===================== GITHUB ===================== -->
  <rect x="20" y="48" width="1160" height="272" rx="12" class="panel"/>
  <text x="38" y="72" class="title">GitHub — repo farols1505/dbt-airflow-dataops</text>

  <rect x="40" y="105" width="150" height="70" rx="8" class="box" fill="#ffffff"/>
  <text x="115" y="134" text-anchor="middle" class="h">Lập trình viên</text>
  <text x="115" y="153" text-anchor="middle" class="t">nhánh feature/*</text>

  <rect x="240" y="92" width="235" height="110" rx="8" class="box" fill="#ddf4ff"/>
  <text x="357" y="113" text-anchor="middle" class="h">CI — mọi Pull Request</text>
  <text x="252" y="135" class="t">• lint: black, flake8, sqlfluff</text>
  <text x="252" y="153" class="t">• dag-tests: pytest DAG Airflow</text>
  <text x="252" y="171" class="t">• dbt-build: compile, build, freshness</text>
  <text x="252" y="189" class="t">• validate-pr: tiêu đề, nhánh, conflict</text>
  <path d="M190,140 L236,140" class="flow"/>
  <text x="213" y="132" text-anchor="middle" class="s">PR</text>

  <rect x="520" y="95" width="165" height="44" rx="8" class="box" fill="#ffffff"/>
  <text x="602" y="122" text-anchor="middle" class="t">merge › develop</text>
  <rect x="520" y="158" width="165" height="44" rx="8" class="box" fill="#ffffff"/>
  <text x="602" y="185" text-anchor="middle" class="t">merge › main (phát hành)</text>
  <path d="M475,125 L516,117" class="flow"/>
  <path d="M475,170 L516,180" class="flow"/>

  <rect x="735" y="95" width="160" height="44" rx="8" class="box" fill="#dafbe1"/>
  <text x="815" y="122" text-anchor="middle" class="h">Deploy DEV</text>
  <path d="M685,117 L731,117" class="flow"/>

  <rect x="735" y="158" width="140" height="44" rx="8" class="box" fill="#dafbe1"/>
  <text x="805" y="185" text-anchor="middle" class="h">Deploy STAGING</text>
  <rect x="895" y="158" width="70" height="44" rx="8" class="box" fill="#fff8c5"/>
  <text x="930" y="185" text-anchor="middle" class="t">Duyệt</text>
  <rect x="985" y="158" width="175" height="44" rx="8" class="box" fill="#ffd8b5"/>
  <text x="1072" y="178" text-anchor="middle" class="h">Deploy PRODUCTION</text>
  <text x="1072" y="194" text-anchor="middle" class="s">› tag prod-YYYYMMDD-HHMM</text>
  <path d="M685,180 L731,180" class="flow"/>
  <path d="M875,180 L891,180" class="flow"/>
  <path d="M965,180 L981,180" class="flow"/>

  <rect x="520" y="220" width="640" height="34" rx="6" class="dashed"/>
  <text x="840" y="242" text-anchor="middle" class="t">Mỗi lần deploy: pre-check › (prod: backup) › dbt run › dbt test › health check › lỗi thì rollback tự động</text>

  <rect x="40" y="220" width="435" height="34" rx="6" class="dashed"/>
  <text x="257" y="242" text-anchor="middle" class="t">Runner: SQL Server tạm + dbt dựng bằng chính docker compose của dự án</text>

  <rect x="40" y="270" width="190" height="34" rx="6" class="box" fill="#ffffff"/>
  <text x="135" y="292" text-anchor="middle" class="t">Rollback (thủ công)</text>
  <rect x="245" y="270" width="230" height="34" rx="6" class="box" fill="#ffffff"/>
  <text x="360" y="292" text-anchor="middle" class="t">Deployment Report (hằng tuần)</text>
  <rect x="520" y="270" width="300" height="34" rx="6" class="box" fill="#ffffff"/>
  <text x="670" y="292" text-anchor="middle" class="t">GitHub Pages: tài liệu dbt + lineage tương tác</text>

  <!-- ===================== LOCAL ===================== -->
  <rect x="20" y="345" width="1160" height="400" rx="12" class="panel"/>
  <text x="38" y="369" class="title">Máy local — Docker Compose (cổng chỉ mở cho 127.0.0.1)</text>

  <rect x="40" y="388" width="700" height="215" rx="10" class="box" fill="#ffffff"/>
  <text x="390" y="410" text-anchor="middle" class="h">SQL Server 2019 — database AdventureWorks2014</text>

  <rect x="58" y="425" width="150" height="150" rx="8" class="box" fill="#eceff1"/>
  <text x="133" y="448" text-anchor="middle" class="h">Nguồn</text>
  <text x="133" y="474" text-anchor="middle" class="t">Sales</text>
  <text x="133" y="494" text-anchor="middle" class="t">Production</text>
  <text x="133" y="514" text-anchor="middle" class="t">Person</text>
  <text x="133" y="545" text-anchor="middle" class="s">7 bảng, freshness</text>
  <text x="133" y="560" text-anchor="middle" class="s">theo ModifiedDate</text>

  <rect x="238" y="445" width="145" height="110" rx="8" class="box" fill="#f3e0c7"/>
  <text x="310" y="470" text-anchor="middle" class="h">&lt;env&gt;_bronze</text>
  <text x="310" y="492" text-anchor="middle" class="t">7 view</text>
  <text x="310" y="512" text-anchor="middle" class="s">1-1 với bảng nguồn</text>
  <text x="310" y="528" text-anchor="middle" class="s">đổi tên, ép kiểu</text>

  <rect x="411" y="445" width="145" height="110" rx="8" class="box" fill="#e6e6e6"/>
  <text x="483" y="470" text-anchor="middle" class="h">&lt;env&gt;_silver</text>
  <text x="483" y="492" text-anchor="middle" class="t">3 bảng</text>
  <text x="483" y="512" text-anchor="middle" class="s">join + nghiệp vụ</text>
  <text x="483" y="528" text-anchor="middle" class="s">orders: incremental</text>

  <rect x="584" y="445" width="145" height="110" rx="8" class="box" fill="#fff3c4"/>
  <text x="656" y="470" text-anchor="middle" class="h">&lt;env&gt;_gold</text>
  <text x="656" y="492" text-anchor="middle" class="t">4 bảng</text>
  <text x="656" y="512" text-anchor="middle" class="s">doanh số, khách hàng,</text>
  <text x="656" y="528" text-anchor="middle" class="s">sản phẩm, RFM</text>

  <path d="M208,500 L234,500" class="flow"/>
  <path d="M383,500 L407,500" class="flow"/>
  <path d="M556,500 L580,500" class="flow"/>
  <text x="390" y="590" text-anchor="middle" class="s">env = dev | staging | prod | ci  (mỗi môi trường một bộ schema)</text>

  <rect x="780" y="388" width="180" height="80" rx="8" class="box" fill="#ddf4ff"/>
  <text x="870" y="414" text-anchor="middle" class="h">Container dbt</text>
  <text x="870" y="434" text-anchor="middle" class="t">dbt-core 1.8.7</text>
  <text x="870" y="452" text-anchor="middle" class="s">14 model · 140+ test</text>
  <path d="M780,428 L744,428" class="flow"/>
  <text x="762" y="420" text-anchor="middle" class="s">build</text>

  <rect x="990" y="388" width="170" height="80" rx="8" class="box" fill="#ede7f6"/>
  <text x="1075" y="414" text-anchor="middle" class="h">Discord</text>
  <text x="1075" y="434" text-anchor="middle" class="t">thông báo</text>
  <text x="1075" y="452" text-anchor="middle" class="s">(dịch vụ ngoài)</text>

  <rect x="780" y="500" width="380" height="95" rx="8" class="box" fill="#dafbe1"/>
  <text x="970" y="522" text-anchor="middle" class="h">Airflow 2.7.1 — webserver :8080 + scheduler</text>
  <text x="970" y="543" text-anchor="middle" class="t">DAG dbt_pipeline (@daily, retry, timeout)</text>
  <text x="970" y="562" text-anchor="middle" class="s">freshness › bronze › silver › gold › data quality › docs</text>
  <text x="970" y="580" text-anchor="middle" class="s">mỗi tầng: dbt run › dbt test</text>
  <path d="M870,500 L870,472" class="flow"/>
  <text x="878" y="490" class="s">docker exec</text>

  <rect x="780" y="640" width="180" height="62" rx="8" class="box" fill="#ffffff"/>
  <text x="870" y="666" text-anchor="middle" class="h">PostgreSQL</text>
  <text x="870" y="686" text-anchor="middle" class="s">metadata Airflow</text>
  <path d="M870,595 L870,636" class="flow"/>

  <rect x="990" y="640" width="170" height="62" rx="8" class="box" fill="#fff3c4"/>
  <text x="1075" y="666" text-anchor="middle" class="h">Grafana :3000</text>
  <text x="1075" y="686" text-anchor="middle" class="s">dashboard (Bonus)</text>
  <path d="M990,671 L964,671" class="read"/>
  <path d="M1075,702 L1075,725 L390,725 L390,607" class="read"/>
  <text x="730" y="719" text-anchor="middle" class="s">đọc số dòng, độ tươi dữ liệu, doanh thu</text>

  <!-- Thông báo -->
  <path d="M1150,500 L1150,472" class="notify"/>
  <text x="1143" y="490" text-anchor="end" class="s" fill="#6f42c1">lỗi / xong</text>
  <path d="M1140,254 L1140,384" class="notify"/>
  <text x="1145" y="335" text-anchor="end" class="s" fill="#6f42c1">kết quả deploy</text>

  <!-- Chú thích -->
  <line x1="40" y1="768" x2="80" y2="768" class="flow"/>
  <text x="88" y="772" class="s">luồng chính</text>
  <line x1="180" y1="768" x2="220" y2="768" class="read"/>
  <text x="228" y="772" class="s">đọc dữ liệu</text>
  <line x1="320" y1="768" x2="360" y2="768" class="notify"/>
  <text x="368" y="772" class="s">thông báo</text>
</svg>
